name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Database security suites (RLS, isolation, escalation, privacy)
        run: npm run test:db
        env: { DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/postgres" }
      - run: npm run build
      - name: UI smoke (responsive + axe WCAG 2.2 AA)
        run: npx playwright install --with-deps chromium && npm run test:ui
