# Supabase CLI config for local development (`supabase start`). Hosted projects: mirror these in the dashboard.
project_id = "alums"

[api]
schemas = ["public"]           # `private` is intentionally NOT exposed through the Data API
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/confirm"]
enable_signup = true
minimum_password_length = 10

[auth.email]
enable_confirmations = true
double_confirm_changes = true
secure_password_change = true

[auth.mfa]
max_enrolled_factors = 4

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
file_size_limit = "5MiB"
